<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeapartyRoom</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login">
      <label for="username">닉네임</label>
      <input type="text" id="username" />

      <label for="password">비밀번호</label>
      <input type="password" id="password" />

      <button onclick="doLogin()">로그인</button>
      <button onclick="change('createuser')">회원가입하기</button>
      <div id="loginerror"></div>
    </div>

    <div id="createuser" style="display: none">
      <label for="create_username">닉네임</label>
      <input type="text" id="create_username" />

      <label for="create_password">비밀번호</label>
      <input type="password" id="create_password" />

      <button onclick="doCreateUser()">회원가입</button>
      <div id="createerror"></div>
    </div>

    <div id="write" style="display: none">
      <button onclick="change('write')">글쓰기</button>
      <button onclick="change('sent_email')">보낸 편지함</button>
      <button onclick="change('received_email')">받은 편지함</button>
      <button onclick="change('changeinfo')">내 정보 변경</button>
      <button onclick="doLogout()">로그아웃</button>

      <label for="write_name">받는 사람 닉네임</label>
      <input type="text" id="write_name" />

      <label for="write_title">제목</label>
      <input type="text" id="write_title" />

      <textarea id="write_content" rows="8" cols="40"></textarea>
      <button onclick="doWrite()">보내기</button>
      <div id="writeerror"></div>
    </div>

    <div id="received_email" style="display: none">
      <button onclick="change('write')">글쓰기</button>
      <button onclick="change('sent_email')">보낸 편지함</button>
      <button onclick="change('received_email')">받은 편지함</button>
      <button onclick="change('changeinfo')">내 정보 변경</button>
      <button onclick="doLogout()">로그아웃</button>
    </div>

    <div id="sent_email" style="display: none">
      <button onclick="change('write')">글쓰기</button>
      <button onclick="change('sent_email')">보낸 편지함</button>
      <button onclick="change('received_email')">받은 편지함</button>
      <button onclick="change('changeinfo')">내 정보 변경</button>
      <button onclick="doLogout()">로그아웃</button>
    </div>

    <div id="read_r" style="display: none">
      <button onclick="change('received_email')">돌아가기</button>
      <label for="sendername">닉네임</label>
      <input type="text" id="sendername" />
      <label for="rtitle">제목</label>
      <input type="text" id="rtitle" />
      <textarea id="r_content" rows="8" cols="40"></textarea>
    </div>

    <div id="read_s" style="display: none">
      <button onclick="change('sent_email')">돌아가기</button>
      <label for="receivername">닉네임</label>
      <input type="text" id="receivername" />
      <label for="stitle">제목</label>
      <input type="text" id="stitle" />
      <textarea id="s_content" rows="8" cols="40"></textarea>
    </div>

    <div id="changeinfo" style="display: none">
      <label for="new_username">새 닉네임</label>
      <input type="text" id="new_username" />

      <label for="new_password">새 비밀번호</label>
      <input type="password" id="new_password" />

      <button onclick="change('write')">돌아가기</button>
      <button onclick="doUpdateUser()">수정</button>
      <button onclick="change('deleteuser')">회원 탈퇴</button>
      <div id="updateerror"></div>
    </div>

    <div id="deleteuser" style="display: none">
      <div>정말 탈퇴하겠습니까?</div>
      <label for="agree">동의를 입력하세요</label>
      <input type="text" id="agree" />

      <button onclick="change('changeinfo')">취소</button>
      <button onclick="doDeleteUser()">탈퇴</button>
      <div id="deleteerror"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
